experiment:
  name: "exp_iid_s1_simple_pool"
  description: "IID distribution with S1 Simple Pool aggregation"

dataset:
  type: "Iris"
  test_size: 0.3
  scale: true

federation:
  n_clients: 5
  distribution: "iid"  # ← IID (uniform distribution)
  seed: 42

model:
  n_estimators: 50
  alpha: 0.1  # Proactive Forest diversity parameter
  split_criterion: "entropy"
  verbose: false

aggregation:
  strategy: "S1"  # S1: Simple Pool (all trees)
  
prediction:
  local_weight: 0.4
  global_weight: 0.6
