experiment:
  name: "exp_noniid_dirichlet_s7"
  description: "Non-IID Dirichlet distribution with S7 Per-Client F1+PCD aggregation"

dataset:
  type: "Iris"
  test_size: 0.3
  scale: true

federation:
  n_clients: 5
  distribution: "noniid_dirichlet"  # ← Non-IID Dirichlet
  alpha: 0.5  # Heterogeneity parameter
              # alpha = 10.0 → Low heterogeneity (close to IID)
              # alpha = 1.0  → Moderate heterogeneity
              # alpha = 0.5  → High heterogeneity
              # alpha = 0.1  → Extreme heterogeneity
  seed: 42

model:
  n_estimators: 100
  alpha: 0.1  # Proactive Forest diversity parameter
  split_criterion: "entropy"
  verbose: false

aggregation:
  strategy: "S7"  # S7: Per-Client F1+PCD (diversity + accuracy)
  f1_weight: 0.5  # Weight for F1 in scoring
  pcd_weight: 0.5  # Weight for PCD (diversity) in scoring

prediction:
  local_weight: 0.4
  global_weight: 0.6

metadata:
  validation_split: 0.2
