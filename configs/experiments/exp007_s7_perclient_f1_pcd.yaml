experiment:
  name: "exp007_s7_perclient_f1_pcd_noniid"
  seed: 42

dataset:
  type: NSL-KDD
  name: nslkdd
  train_path: "data/nslkdd/KDDTrain+.csv"
  test_path:  "data/nslkdd/KDDTest+.csv"
  target_column: "class"
  categorical_features: ["protocol_type", "service", "flag"]
  scale: true
  scaler_type: standard

federation:
  n_clients: 5
  distribution: noniid_dirichlet
  dirichlet_alpha: 0.5

model:
  n_estimators: 100
  alpha: 0.1
  split_criterion: entropy
  feature_selection: prob
  use_progressive_stopping: true
  convergence: 0.002
  episode_size: 5

aggregation:
  strategy: s7_perclient_f1_pcd
  f1_weight: 0.5
  pcd_weight: 0.5
  convergence: 0.002
  episode_size: 5

prediction:
  local_weight: 0.4
  global_weight: 0.6

verbose: false
seed: 42
