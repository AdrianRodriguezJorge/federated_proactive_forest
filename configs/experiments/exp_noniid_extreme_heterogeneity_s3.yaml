experiment:
  name: "exp_noniid_extreme_heterogeneity_s3"
  description: "Extreme heterogeneity (alpha=0.1) with S3 Global F1 aggregation"
  
dataset:
  type: "Iris"
  test_size: 0.3
  scale: true

federation:
  n_clients: 5
  distribution: "noniid_dirichlet"
  alpha: 0.1  # EXTREME heterogeneity
              # Each client's label distribution heavily biased
              # Simulates realistic federated scenarios with distinct device types
  seed: 42

model:
  n_estimators: 100
  alpha: 0.05  # Increased diversity with extreme heterogeneity
  split_criterion: "entropy"
  verbose: false

aggregation:
  strategy: "S3"  # S3: Global F1 ranking (ignore diversity, global performance)
  
prediction:
  local_weight: 0.3
  global_weight: 0.7

metadata:
  validation_split: 0.2

notes: |
  With alpha=0.1, each client's label distribution will be very skewed.
  Example 5-client iris split with alpha=0.1:
  Client 0: [setosa: 70%, versicolor: 20%, virginica: 10%]
  Client 1: [setosa: 10%, versicolor: 80%, virginica: 10%]
  Client 2: [setosa: 5%, versicolor: 5%, virginica: 90%]
  Client 3: [setosa: 20%, versicolor: 70%, virginica: 10%]
  Client 4: [setosa: 10%, versicolor: 15%, virginica: 75%]
