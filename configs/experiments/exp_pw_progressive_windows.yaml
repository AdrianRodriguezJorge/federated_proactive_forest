experiment:
  name: "exp_pw_progressive_windows_letter"
  description: "Progressive Windows - Window-based incremental training with Round Robin dynamic scoring"

dataset:
  type: "Letter"
  train_path: "data/letter.csv"
  target_column: "class"
  categorical_features: []
  scale: true
  scaler_type: standard
  test_size: 0.2

federation:
  n_clients: 5
  distribution: "iid"
  seed: 42

model:
  n_estimators: 100
  alpha: 0.1
  split_criterion: "entropy"
  use_progressive_stopping: true
  convergence: 0.002
  episode_size: 5
  window_size: 10
  verbose: false

aggregation:
  strategy: "PW"
  f1_weight: 0.5
  window_size: 10
  max_rounds: 20
  convergence_threshold: 0.002
  t_max: 100
  trees_per_round_per_client: 3
  min_rounds: 3

prediction:
  local_weight: 0.5
  global_weight: 0.5

verbose: false
seed: 42
