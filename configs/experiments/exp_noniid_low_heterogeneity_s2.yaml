experiment:
  name: "exp_noniid_low_heterogeneity_s2"
  description: "Low heterogeneity (alpha=10.0, near-IID) with S2 Global Accuracy aggregation"
  
dataset:
  type: "Iris"
  test_size: 0.3
  scale: true

federation:
  n_clients: 5
  distribution: "noniid_dirichlet"
  alpha: 10.0  # Low heterogeneity - distributions are similar to IID
               # When alpha >= 5.0, approaches uniform distribution (IID behavior)
               # Useful for comparing: how much heterogeneity matters?
  seed: 42

model:
  n_estimators: 100
  alpha: 0.1
  split_criterion: "entropy"
  verbose: false

aggregation:
  strategy: "S2"  # S2: Global Accuracy (simple baseline, compare with S1/S7)
  
prediction:
  local_weight: 0.5
  global_weight: 0.5

notes: |
  With alpha=10.0, label distributions are very similar across clients.
  Example comparison:
  
  Low Heterogeneity (alpha=10.0):
  Client 0: [setosa: 35%, versicolor: 32%, virginica: 33%]
  Client 1: [setosa: 33%, versicolor: 35%, virginica: 32%]
  Client 2: [setosa: 34%, versicolor: 33%, virginica: 33%]
  Client 3: [setosa: 32%, versicolor: 34%, virginica: 34%]
  Client 4: [setosa: 34%, versicolor: 33%, virginica: 33%]
  
  This configuration is useful for baseline comparisons:
  - Compare S2 (global accuracy) against S5 (per-client accuracy)
    when heterogeneity is minimal
  - A/B testing: results should be more similar with low heterogeneity
  - Validate that algorithms don't degrade when data is nearly IID
