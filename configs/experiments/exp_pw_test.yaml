experiment:
  name: "exp_pw_progressive_windows_iris_test"
  description: "Progressive Windows - Test with Iris"

dataset:
  type: "Iris"
  test_size: 0.2

federation:
  n_clients: 3
  distribution: "iid"
  seed: 42

model:
  n_estimators: 10
  alpha: 0.1
  split_criterion: "entropy"
  use_progressive_stopping: true
  convergence: 0.002
  episode_size: 2
  window_size: 2
  verbose: true

aggregation:
  strategy: "PW"
  f1_weight: 0.5
  window_size: 2
  max_rounds: 5
  convergence_threshold: 0.002
  t_max: 10

prediction:
  local_weight: 0.5
  global_weight: 0.5

verbose: true
seed: 42
