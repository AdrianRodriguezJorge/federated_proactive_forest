# Search spaces for hyperparameter optimization
# Each strategy defines which parameters to optimize and their ranges
# N_CLIENTS = 3 for ALL optimization experiments
# alpha_pf step: 0.05 (15 values for fine-grained search)

# ============================================================================
# S1: Simple Pool
# ============================================================================
S1:
  alpha_pf:
    type: float
    low: 0.1
    high: 0.8
    step: 0.05

  local_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1

# ============================================================================
# S2: Global Accuracy with Progressive Forest
# ============================================================================
S2:
  alpha_pf:
    type: float
    low: 0.1
    high: 0.8
    step: 0.05

  t_max:
    type: int
    low: 30
    high: 150
    step: 10

  local_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1

# ============================================================================
# S3: Global Macro-F1 with Progressive Forest
# ============================================================================
S3:
  alpha_pf:
    type: float
    low: 0.1
    high: 0.8
    step: 0.05

  t_max:
    type: int
    low: 30
    high: 150
    step: 10

  local_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1

# ============================================================================
# S4: Global F1 + PCD with Progressive Forest
# ============================================================================
S4:
  alpha_pf:
    type: float
    low: 0.1
    high: 0.8
    step: 0.05

  t_max:
    type: int
    low: 30
    high: 150
    step: 10

  f1_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1

  local_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1

# ============================================================================
# S5: Per-Client Accuracy with Progressive Forest
# ============================================================================
S5:
  alpha_pf:
    type: float
    low: 0.1
    high: 0.8
    step: 0.05

  t_max:
    type: int
    low: 30
    high: 150
    step: 10

  local_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1

# ============================================================================
# S6: Per-Client Macro-F1 with Progressive Forest
# ============================================================================
S6:
  alpha_pf:
    type: float
    low: 0.1
    high: 0.8
    step: 0.05

  t_max:
    type: int
    low: 30
    high: 150
    step: 10

  local_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1

# ============================================================================
# S7: Per-Client F1 + PCD with Progressive Forest
# ============================================================================
S7:
  alpha_pf:
    type: float
    low: 0.1
    high: 0.8
    step: 0.05

  t_max:
    type: int
    low: 30
    high: 150
    step: 10

  f1_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1

  local_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1

# ============================================================================
# PW: Progressive Windows
# ============================================================================
PW:
  alpha_pf:
    type: float
    low: 0.1
    high: 0.6
    step: 0.05

  window_size:
    type: int
    low: 5
    high: 10
    step: 1

  max_rounds:
    type: int
    low: 10
    high: 20
    step: 5

  f1_weight:
    type: float
    low: 0.1
    high: 1.0
    step: 0.1

  convergence_threshold:
    type: float
    low: 0.001
    high: 0.01
    log: true

  local_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1
