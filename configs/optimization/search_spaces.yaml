# Search spaces for hyperparameter optimization
# Each strategy defines which parameters to optimize and their ranges

# ============================================================================
# S1: Simple Pool
# ============================================================================
S1:
  alpha_pf:
    type: float
    low: 0.05
    high: 0.9
    step: 0.05

  local_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1

  local_convergence:
    type: float
    low: 0.0001
    high: 0.01
    log: true

# ============================================================================
# S2: Global Accuracy with Progressive Forest
# ============================================================================
S2:
  alpha_pf:
    type: float
    low: 0.05
    high: 0.9
    step: 0.05

  t_max:
    type: int
    low: 30
    high: 150
    step: 10

  local_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1

  convergence_threshold:
    type: float
    low: 0.0001
    high: 0.01
    log: true

  local_convergence:
    type: float
    low: 0.0001
    high: 0.01
    log: true

