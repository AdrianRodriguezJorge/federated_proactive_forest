# ============================================================================
# S9: Global Attribute Roulette (Roulette Strategy)
# ============================================================================
S9:
  variant:
    type: categorical
    choices: ["S9_MEAN", "S9_CONSENSUS", "S9_MEDIAN", "S9_WEIGHTED", "S9_PROACTIVE_PCD"]

  local_roulette_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1

  alpha_pf:
    type: float
    low: 0.05
    high: 0.9
    step: 0.05

  window_size:
    type: int
    low: 3
    high: 15
    step: 1

  max_rounds:
