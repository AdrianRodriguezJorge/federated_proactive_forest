# Search spaces for hyperparameter optimization

# ============================================================================
# UNIFIED: Joint search space for finding optimal shared configuration
# ============================================================================
UNIFIED:
  local_convergence_threshold:
    type: categorical
    choices: [0.001, 0.002, 0.005]

  local_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1

  use_weighted:
    type: categorical
    choices: [true, false]


  max_trees:
    type: int
    low: 50
    high: 150
    step: 20

  global_convergence_threshold:
    type: categorical
    choices: [0.001, 0.002, 0.005]

  f1_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1

  local_roulette_weight:
    type: float
    low: 0.0
    high: 1.0
    step: 0.1

  pace_combination:
    type: categorical
    choices: ["3_1", "6_2", "9_3", "5_1", "10_3"]

  roulette_pace:
    type: categorical
    choices: ["5_30", "10_15", "15_10"]



