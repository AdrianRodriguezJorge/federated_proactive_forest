# Benchmark Single Fold - Hyperparameters Configuration
# Saved: 2026-05-24
# These hyperparameters were used to run all 13 strategies across the 7 benchmark datasets.

experiment_metadata:
  n_clients: 3
  train_size_percent: 80
  val_size_percent: 10
  test_size_percent: 10
  cross_validation: false

base_model_config:
  n_estimators: 100
  alpha: 0.1
  voting: "soft"
  local_convergence_threshold: 0.002

base_prediction_config:
  local_weight: 0.4
  use_weighted: true

strategies:
  # FLEX Baselines (S1 - S7)
  s1_simple_pool:
    aggregation:
      strategy: "s1_simple_pool"
      max_rounds: 20
      global_convergence_threshold: 0.002
      global_episode_size: 3
      trees_per_client_per_episode: 1
      trees_per_round_per_client: 1
      min_episodes: 4
      min_rounds: 4
      window_size: 5
      f1_weight: 0.3
      pcd_weight: 0.7

  s2_global_accuracy:
