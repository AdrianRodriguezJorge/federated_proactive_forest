name: "iris"
# Nota: El dataset Iris se carga desde scikit-learn (sklearn.datasets.load_iris)
# El path es opcional y se ignora en el IrisAdapter
path: null
target_column: "class"
test_size: 0.2
random_state: 42
scale_numerical: true
encode_categorical: false
categorical_columns: []
numerical_columns:
  - "sepallength"
  - "sepalwidth"
  - "petallength"
  - "petalwidth"