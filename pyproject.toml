[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-proactive-forest"
version = "3.0.0"
description = "Federated Learning con Proactive Forest (Cepero 2023) + 7 estrategias de agregación + UI Streamlit"
requires-python = ">=3.12"

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.1",
    "scikit-learn>=1.3.2",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.35",
    "plotly>=5.20",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
opt = [
    "optuna>=3.5",
    "joblib>=1.3",
    "tensorly>=0.8",
]
flex = [
    "flexible-fl>=0.6.1",
    "flextrees>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["proactive_forest*", "src*"]
